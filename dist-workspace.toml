[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# cargo-dist 版本
cargo-dist-version = "0.32.0"
# CI 平台
ci = "github"
# 安装器类型（shell/powershell 脚本）
installers = ["shell", "powershell"]
# 目标三元组（三平台 5 target）
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# 发布任务：仅 GitHub Release（不发布到 Homebrew/Scoop）
publish-jobs = []
# GitHub Release 配置
create-release = true
github-attestations = false
# PR 上运行 plan 模式（不实际构建，仅检查配置）
pr-run-mode = "plan"
# ENG-2（2026-08-25 R2 审查）：release.yml 已手工加固（concurrency 组 +
# timeout-minutes），与 dist 生成模板存在预期漂移——allow-dirty 声明 CI
# 产物可脏，跳过"CI 文件过期"检查，保留手工加固项。
# 注意：该字段为**序列类型**（首次误写 boolean 导致 dist 解析失败）。
allow-dirty = ["ci"]

# 自定义构建运行器（按平台分配 GitHub Actions runner）
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-apple-darwin = "macos-14"
aarch64-apple-darwin = "macos-14"
x86_64-pc-windows-msvc = "windows-2022"

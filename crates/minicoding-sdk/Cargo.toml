[package]
name = "minicoding-sdk"
description = "嵌入 SDK（M8）：为第三方 Rust 程序提供高层嵌入 API，隐藏 Runtime 细节"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# A11：builder 组装 feature 矩阵（与原 cli/builder.rs cfg 门控对齐）
default = ["sandbox", "hooks", "file-undo", "web", "extensions", "cred-keyring", "mcp"]
hooks = ["dep:minicoding-hooks"]
file-undo = ["dep:minicoding-journal"]
sandbox = ["dep:minicoding-sandbox"]
extensions = ["dep:minicoding-extension-sdk"]
mcp = ["dep:minicoding-mcp"]
web = ["minicoding-tools/web"]
cred-keyring = ["dep:keyring"]

[dependencies]
minicoding-core = { workspace = true }
minicoding-policy = { workspace = true }
minicoding-tools = { workspace = true }
minicoding-context = { workspace = true }
minicoding-storage = { workspace = true }
minicoding-providers = { workspace = true }
minicoding-memory = { workspace = true }
# A11 以下为 builder 组装的可选领域 crate（feature 名与 cli 对齐）
minicoding-hooks = { workspace = true, optional = true }
minicoding-journal = { workspace = true, optional = true }
minicoding-sandbox = { workspace = true, optional = true }
minicoding-extension-sdk = { workspace = true, optional = true }
minicoding-mcp = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
# F1（测试时钟改造）：`start_paused = true` 虚拟时钟需要 test-util
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

[package]
name = "minicoding-context"
description = "ContextManager 实现 + 4 级压缩管道 + 权重模型 + 熔断"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
minicoding-core = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tiktoken-rs = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }
# R8：#1 PreCompact/PostCompact Hook 派发需要 Utf8PathBuf（HookInput.cwd）
camino = { workspace = true }

[dev-dependencies]
# A8 架构守卫：复用 core 的 manifest 断言
minicoding-core = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "compress"
harness = false

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

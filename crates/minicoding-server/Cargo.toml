[package]
name = "minicoding-server"
description = "HTTP/SSE server + ACP/LSP 适配器（多前端接入层）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "minicoding_server"
path = "src/lib.rs"

[[bin]]
name = "minicoding-server"
path = "src/main.rs"

[dependencies]
minicoding-core = { workspace = true }
minicoding-protocol = { workspace = true }
minicoding-policy = { workspace = true }
minicoding-tools = { workspace = true, features = ["web"] }
minicoding-context = { workspace = true }
minicoding-storage = { workspace = true }
minicoding-providers = { workspace = true }
minicoding-memory = { workspace = true }
minicoding-journal = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
# OTLP 导出（桌面 sidecar 与独立 server 可观测性接入，见 `docs/observability.md` §7）
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }
# P1：HTTP DTO TS 导出（feature `ts`，仅 dev/CI 使用）
ts-rs = { workspace = true, optional = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }

# OS keyring 凭证 fallback（C-04：sidecar 模式下 API key 从 keyring 读取，不通过参数/env 传递）
keyring = { workspace = true }

# 沙箱驱动（默认启用，与 CLI 对齐；minicoding-server 直接构造 Runtime）
minicoding-sandbox = { workspace = true }

[features]
ts = ["dep:ts-rs", "minicoding-core/ts"]
default = ["otel"]
# OTLP 可观测性（与 CLI `otel` feature 对齐；默认启用，保证桌面 sidecar 开箱可接入，
# 见 `docs/observability.md` §7；未配置 `OTEL_EXPORTER_OTLP_ENDPOINT` 时降级为纯本地 fmt 日志）
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
# LSP 适配器（T-M8-8，tower-lsp 重依赖，feature gate）
lsp = ["dep:tower-lsp"]
# ACP 适配器（T-M8-7）

# 可选重依赖（feature gate 才引入）
[dependencies.tower-lsp]
workspace = true
optional = true

[dev-dependencies]
minicoding-core = { workspace = true, features = ["test-util"] }
# R10-05：能力矩阵守卫测试调用真实装配函数——server 测试需引用 SDK 侧
# `assemble_sdk_tool_registry` 比对（仅测试期依赖，不影响生产依赖图）。
minicoding-sdk = { workspace = true }
# F1（测试时钟改造）：`start_paused = true` 虚拟时钟需要 test-util
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
# E2E 框架（tests/e2e.rs）：spawn 真实 server 进程 + reqwest 驱动 HTTP/SSE +
# wiremock mock LLM 端点（默认路径，CI 安全）；真实 LLM 经 env 门控跳过。
reqwest = { workspace = true }
wiremock = { workspace = true }

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

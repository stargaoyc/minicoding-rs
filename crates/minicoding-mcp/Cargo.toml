[package]
name = "minicoding-mcp"
description = "MCP client/server（基于官方 rmcp 2.x）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
minicoding-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

# rmcp 2.x 官方 SDK（M4 起引入，见 modules.md §8.3、tech-stack.md §11.1）
# M4 仅用 stdio 传输（client）；http + OAuth 留给 M6（T-M6-4）。
rmcp = { version = "2.0", default-features = false, features = [
    "client",
    "transport-child-process",
] }

[dev-dependencies]
tempfile = { workspace = true }

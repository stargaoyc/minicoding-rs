[package]
name = "minicoding-mcp"
description = "MCP client/server（基于官方 rmcp 2.x）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
minicoding-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

# rmcp 2.x 官方 SDK（M4 起引入，见 modules.md §8.3、tech-stack.md §11.1）
# M4 用 stdio 传输；M6（T-M6-4）补齐 streamable HTTP + bearer token 鉴权。
# M8（T-M8-3）补齐 server + transport-io：把自身工具暴露为 MCP server。
rmcp = { version = "2.0", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
] }
# http 类型（HeaderName/HeaderValue），与 rmcp/reqwest 共用同一版本。
http = "1"

[dev-dependencies]
# A8 架构守卫：复用 core 的 manifest 断言
minicoding-core = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

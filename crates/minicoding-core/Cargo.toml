[package]
name = "minicoding-core"
description = "抽象层：数据模型 + 核心 trait + Runtime 编排 + Event + Config + OTel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# core 必须轻量，无平台/网络重依赖（见 modules.md §1.4、§15.6）
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
time = { workspace = true }
home = { workspace = true }
trait-variant = { workspace = true }
semver = { workspace = true }
# 文件监听（S-22 配置热更新 ConfigWatcher，见 tech-stack.md §8、features.md S-22）
# notify 是跨平台文件系统通知库；core 通过其监听 config.toml 变更广播 Event::ConfigChanged。
notify = { workspace = true }

# TypeScript 类型生成（M9，feature gate `ts`，见 AGENTS.md §8.4）
# 仅 `cargo test --features ts` 时生效，正常构建不引入。
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
default = []
# 启用 ts-rs 类型导出（M9 前端 DTO 契约，见 AGENTS.md §8.4）
# `cargo test --features ts -p minicoding-core` 生成 `core` 的 TS 类型到
# `crates/minicoding-web/src/api/generated/`，供前端导入。
ts = ["dep:ts-rs"]

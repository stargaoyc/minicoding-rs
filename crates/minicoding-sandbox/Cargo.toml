[package]
name = "minicoding-sandbox"
description = "OS 级沙箱驱动（Linux Landlock + macOS Seatbelt + Windows Job Object）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
minicoding-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }

# 平台重依赖按 target cfg 隔离（见 modules.md §7.4、tech-stack.md §11）
# Linux：Landlock LSM（文件系统隔离，内核 5.13+）。libseccomp（系统调用过滤）作为
# 后续增强，需系统 libseccomp C 库，M4 先交付 Landlock 核心隔离（C-22 文件越界写拦截）。
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"

# macOS：Seatbelt（sandbox_init FFI，10.5+ 内置），无外部 crate 依赖（FFI 直连 libsystem）

# Windows：Job Object + 受限令牌（windows-sys，MIT/Apache-2.0）
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# A8 架构守卫：复用 core 的 manifest 断言
minicoding-core = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

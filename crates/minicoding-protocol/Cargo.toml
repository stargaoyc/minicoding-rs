[package]
name = "minicoding-protocol"
description = "JSON-RPC 2.0 wire types + Event/Command DTO（前后端协议契约）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
minicoding-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# TypeScript 类型生成（M9，feature gate `ts`，见 AGENTS.md §8.4）
# 启用 `ts` 时连带启用 `minicoding-core/ts`，保证引用的 core 类型也导出。
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# A8 架构守卫：复用 core 的 manifest 断言
minicoding-core = { workspace = true, features = ["test-util"] }
# PersistedEvent::SessionCreated 测试需要 OffsetDateTime 构造（见 event.rs 测试）
time = { workspace = true }

[features]
default = []
# 启用 ts-rs 类型导出（M9 前端 DTO 契约，见 AGENTS.md §8.4）
# `cargo test --features ts -p minicoding-protocol` 生成 protocol + core 的 TS
# 类型到 `crates/minicoding-web/src/api/generated/`。
ts = ["dep:ts-rs", "minicoding-core/ts"]

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

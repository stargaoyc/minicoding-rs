[package]
name = "minicoding-extension-sdk"
description = "扩展作者稳定 API（Extension trait + Registrar + Manifest）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
minicoding-core = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
# A8 架构守卫：复用 core 的 manifest 断言
minicoding-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

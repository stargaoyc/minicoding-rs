[package]
name = "minicoding-tui"
description = "TUI frontend（M7）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "minicoding_tui"
path = "src/lib.rs"

[[bin]]
name = "minicoding-tui"
path = "src/main.rs"

[dependencies]
minicoding-core = { workspace = true }
minicoding-policy = { workspace = true }
# TUI 不需要 keyring（凭证由 CLI/serve 管理）——去掉 cred-keyring。
# 不走 workspace 继承：新版 cargo（≥1.92）禁止成员对继承依赖覆写
# default-features（"`default-features = false` cannot override workspace's
# `default-features`"），直接声明 path 依赖以兼容新旧两代 cargo。
minicoding-sdk = { path = "../minicoding-sdk", default-features = false, features = [
    "sandbox", "hooks", "file-undo", "web", "extensions",
] }
minicoding-storage = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
time = { workspace = true }

# TUI 渲染（见 modules.md §13.3）
ratatui = { workspace = true }
crossterm = { workspace = true }

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

[package]
name = "minicoding-desktop"
description = "Tauri 2.x 桌面壳（M9，sidecar 启动 minicoding-server）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# cargo-dist 排除：Tauri 需平台 GUI 依赖，单独发布 .dmg/.msi/.AppImage
[package.metadata.dist]
dist = false

[lib]
name = "minicoding_desktop"
path = "src/lib.rs"

[[bin]]
name = "minicoding-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
minicoding-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
anyhow = { workspace = true }
camino = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# OS keyring 凭证管理（与 CLI `cred.rs` 共享 `KEYRING_SERVICE`，C-04）
keyring = { workspace = true, optional = true }

# Tauri 重依赖（feature gate `desktop`，需系统 webview 运行时）
# 直接声明而非 workspace.dependencies，避免未启用 feature 时 Cargo 解析整个 tauri 依赖树
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true, features = ["colored"] }
# W-07：系统托盘 + 全局快捷键（Tauri 2.x 内置 tray，global-shortcut 通过 plugin）
tauri-plugin-global-shortcut = { version = "2", optional = true }
# W-11 新建会话目录选择（官方原生对话框插件）
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
# tauri-build：generate_context! 宏依赖的 build script（仅 desktop feature 启用）
tauri-build = { version = "2", optional = true }

[features]
default = []
# 启用 Tauri 桌面壳（需 webkit2gtk Linux / WebKit macOS / WebView2 Windows）
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-dialog",
    "dep:keyring",
]

[dev-dependencies]
tempfile = { workspace = true }

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

[package]
name = "minicoding-cli"
description = "CLI frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "minicoding_cli"
path = "src/lib.rs"

[[bin]]
name = "minicoding"
path = "src/main.rs"

[dependencies]
minicoding-core = { workspace = true }
# R10-15：SDK 用 path 依赖 + default-features=false——此前 workspace 继承导致
# SDK 全部 default features（sandbox/hooks/file-undo/web/extensions/cred-keyring/mcp）
# 恒开，CLI 的六个 feature 无法关闭（cargo 禁止成员覆写继承依赖的 default-features，
# 见 tui Cargo.toml 注释）。SDK 的 cred-keyring 常开（CLI cred 命令需要），其余经
# 下方 feature 显式传播。
minicoding-sdk = { path = "../minicoding-sdk", default-features = false, features = [
    "cred-keyring",
] }
minicoding-context = { workspace = true }
minicoding-policy = { workspace = true }
minicoding-storage = { workspace = true }
minicoding-providers = { workspace = true }
minicoding-tools = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
anstream = { workspace = true }
anstyle = { workspace = true }
rustyline = { workspace = true }
# 隐藏终端输入（FE-5，R5：cred store 不再回显 API key）
rpassword = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

# 可选能力（feature gate，见 modules.md §0.4）
minicoding-memory = { workspace = true, optional = true }
minicoding-hooks = { workspace = true, optional = true }
minicoding-journal = { workspace = true, optional = true }
minicoding-sandbox = { workspace = true, optional = true }
minicoding-mcp = { workspace = true, optional = true }
# R10-15：server 同样用 path + default-features=false——此前继承使
# `server/default = ["otel"]` 的 OTLP 栈恒编入 CLI（而 CLI 自己的 otel feature
# 不在 default，编译了却不初始化）。CLI 的 otel feature 显式传播。
minicoding-server = { path = "../minicoding-server", default-features = false, optional = true }
# 扩展 SDK（Extension trait + BundledExtensionHost + 9 内置 PromptContributor）
minicoding-extension-sdk = { workspace = true, optional = true }

# 凭证存储（OS keyring，T-M4-11）
keyring = { workspace = true }

# 备份打包（S-05，见 data-model.md §12）
tar = { workspace = true }
flate2 = { workspace = true }

[features]
# serve/mcp 默认开：CLI 是主入口，serve 子命令和 MCP stdio 是高频场景；
# R9 UX-3 修复：file-undo 加入默认——/undo 是误操作后的关键回退能力，
# 默认关闭让用户在需要时拿不到（安全功能应开箱即用）；hooks 仍需用户
# 主动配置 hooks.toml 才有意义，保持非默认。
default = ["memory", "sandbox", "serve", "mcp", "file-undo"]
memory = ["dep:minicoding-memory"]
hooks = ["dep:minicoding-hooks", "minicoding-sdk/hooks"]
file-undo = ["dep:minicoding-journal", "minicoding-sdk/file-undo"]
sandbox = ["dep:minicoding-sandbox", "minicoding-sdk/sandbox"]
mcp = ["dep:minicoding-mcp", "minicoding-sdk/mcp"]
serve = ["dep:minicoding-server"]
# 扩展系统（PromptPipeline + BundledExtensionHost，T-M8-2）
extensions = ["dep:minicoding-extension-sdk", "minicoding-sdk/extensions"]
# Web 工具组（web.fetch/web.search，启用 `minicoding-tools` 的 `web` feature）
web = ["minicoding-sdk/web"]
# LSP stdio 适配器（T-M8-8，启用 `minicoding-server` 的 `lsp` feature）
lsp = ["serve", "minicoding-server/lsp"]
# OTLP 导出（需 reqwest，按需启用；未启用时降级为纯 fmt 日志，见 core::otel）
# R10-15：server 已 default-features=false，此处显式传播 server/otel——
# 否则 CLI 的 serve 子命令不会初始化 server 侧 OTLP。
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "minicoding-server/otel"]
full = ["memory", "hooks", "file-undo", "sandbox", "mcp", "serve", "web", "lsp", "otel", "extensions"]

[dev-dependencies]
minicoding-core = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tokio = { workspace = true }

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

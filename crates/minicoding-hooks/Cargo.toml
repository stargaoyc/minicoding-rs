[package]
name = "minicoding-hooks"
description = "HookRegistry + ScriptHook + asyncRewake + 内置 Hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
minicoding-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# 审计记录时间戳（SEC-17：Hook 协议违规记 audit.log 需 ts 字段）
time = { workspace = true }

[target.'cfg(unix)'.dependencies]
# SEC-15（2026-08-28 R5 收尾）：超时杀孙进程——`killpg` 杀整个进程组
libc = { workspace = true }

[dev-dependencies]
# A8 架构守卫：复用 core 的 manifest 断言
minicoding-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
camino = { workspace = true }

# 继承 workspace lints（ENG-8：clippy::all + pedantic deny）
[lints]
workspace = true

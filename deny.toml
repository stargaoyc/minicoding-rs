# cargo-deny 配置（AGENTS.md §2.7 依赖治理）
#
# 许可证白名单：MIT / Apache-2.0 / BSD / ISC（AGENTS.md §2.7）
# 漏洞检测：advisories 段（与 cargo audit 互补，CI deny job 同时检查）
# 来源限制：仅 crates.io

[graph]
all-features = true

[advisories]
# 漏洞数据库（默认 rustsec/advisory-db）
# 忽略的 advisory ID（需附 reason）
ignore = [
    # number_prefix 0.4.0 是 indicatif 的传递依赖（minicoding-cli 用 indicatif 显示进度条）。
    # crate 已 unmaintained（RUSTSEC-2025-0119），但无安全漏洞，indicatif 尚未切换替代。
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained but has no vulnerability; transitive dep of indicatif (minicoding-cli)" },
]
# unmaintained 检查范围：workspace（仅检查 workspace 成员，不检查传递依赖）
# number_prefix 0.4.0 是 indicatif 的传递依赖，已在 ignore 列表中豁免 RUSTSEC-2025-0119
unmaintained = "workspace"
# yanked crate 告警级别
yanked = "deny"

[licenses]
version = 2
# 许可证白名单（AGENTS.md §2.7：仅 MIT/Apache-2.0/BSD/ISC）
# 以下额外许可证为传递依赖必需：
# - AGPL-3.0-only：项目自身 crate（workspace 成员），非外部依赖
# - BSL-1.0：Boost Software License，error-code 等 transitive crate（类 MIT 宽松许可证）
# - OpenSSL：ring（rustls/reqwest 的 crypto backend，含 OpenSSL 衍生代码）
# - Unicode-DFS-2016 / Unicode-3.0：unicode-ident（proc-macro2 传递依赖）
# - Zlib：miniz_oxide（flate2 传递依赖）
# - CC0-1.0：adler（miniz_oxide 传递依赖）
# - Unlicense：部分 transitive crate
# - CDLA-Permissive-2.0：部分 transitive crate
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "AGPL-3.0-only",
    "BSL-1.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# 重复依赖告警（同名多版本需显式 skip）
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
# 仅允许 crates.io，其他 registry 需显式 allow
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

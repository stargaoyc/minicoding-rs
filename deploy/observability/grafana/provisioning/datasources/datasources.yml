# Grafana datasource 预置：Prometheus（metrics）+ Jaeger（traces）。
# minicoding 上报的 span 以 service.name = "minicoding" / "minicoding-server" 区分
# （见 docs/observability.md §7.3）。

apiVersion: 1

datasources:
  - name: Prometheus
    uid: minicoding-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    uid: minicoding-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false

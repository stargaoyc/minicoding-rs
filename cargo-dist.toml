# cargo-dist 配置（Q-08 跨平台二进制构建，Q-09 分发渠道）
#
# 详见 https://opensource.axo.dev/cargo-dist/
# 触发：`cargo dist build` 或推送 tag `v*` 时 CI 自动构建发布。
#
# 覆盖范围：
# - Q-08：Linux/macOS/Windows 三平台二进制（minicoding + minicoding-server）
# - Q-09：Homebrew tap + Scoop bucket + cargo install（通过 publish-jobs）

[dist]
# 目标三元组（三平台）
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# 需要构建的二进制（不含 minicoding-desktop，因 Tauri 需平台 GUI 依赖）
dist = false
ci = ["github"]
installers = ["shell", "powershell", "homebrew", "scoop"]
publish-jobs = ["homebrew", "scoop"]

# Homebrew tap 仓库（Q-09 brew 渠道）
tap = "minicoding/homebrew-tap"

# Scoop bucket 仓库（Q-09 scoop 渠道）
scoop = "minicoding/scoop-bucket"

# cargo install 支持（Q-09 cargo install 渠道）
# 发布到 crates.io 后用户可 `cargo install minicoding`
publish-crates = false

# 仅发布 release profile 二进制（strip + LTO，见 workspace [profile.release]）
cargo-dist-version = "0.25.0"
rust-toolchain-version = "1.99.0"

# GitHub Release 配置
create-release = true
github-attestations = false

# PRERELEASE 标记（rc/beta 版本自动标记为 prerelease）
pr-run-mode = "plan"

# 构建任务矩阵：跳过 minicoding-desktop（需 Tauri GUI 依赖，单独打包）
[dist.binaries]
# 默认包含所有 workspace binary，通过 artifacts 配置排除
# minicoding-desktop 的 [[bin]] 已设 required-features = ["desktop"]，
# 默认构建不含该 feature，故 cargo-dist 不会产出 desktop 二进制（正确行为）

# 自定义安装脚本欢迎信息
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-apple-darwin = "macos-13"
aarch64-apple-darwin = "macos-14"
x86_64-pc-windows-msvc = "windows-2022"

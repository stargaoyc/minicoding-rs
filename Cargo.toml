[workspace]
resolver = "3"
members = [
    "crates/minicoding-core",
    "crates/minicoding-context",
    "crates/minicoding-policy",
    "crates/minicoding-memory",
    "crates/minicoding-hooks",
    "crates/minicoding-journal",
    "crates/minicoding-sandbox",
    "crates/minicoding-mcp",
    "crates/minicoding-storage",
    "crates/minicoding-providers",
    "crates/minicoding-tools",
    "crates/minicoding-protocol",
    "crates/minicoding-server",
    "crates/minicoding-extension-sdk",
    "crates/minicoding-cli",
    "crates/minicoding-tui",
    "crates/minicoding-sdk",
    "crates/minicoding-desktop",
]

# ENG-8（2026-08-25 R2 审查）：lint 规则收敛到 workspace 级——18 个 crate 的
# lib.rs 此前逐个重复 `#![deny(clippy::all, clippy::pedantic)]`，规则变更需改
# 18 处。各 crate 经 `[lints] workspace = true` 继承（存量 crate 内属性保留
# 兼容，新 crate 只需声明 `[lints] workspace = true`）。
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Workspace 全局元数据
[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/stargaoyc/minicoding-rs"
homepage = "https://github.com/stargaoyc/minicoding-rs"
version = "0.3.5"
authors = ["stargaoyc"]

# 统一依赖版本管理（见 AGENTS.md §2.7、tech-stack.md §12）
[workspace.dependencies]
# 异步运行时
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Base64 编解码（MCP wire format 的 image/audio data，见 modules.md §8；
# 2026-08-25 审查 MC-3：以标准 crate 替换 mcp crate 内手写编解码实现）
base64 = "0.22"

# 日志与可观测性（OTel 一等公民，见 tech-stack.md §7、design.md §15）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.29"
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["trace", "http-proto", "reqwest-rustls"] }

# 错误处理（库 crate 用 thiserror，边界用 anyhow，见 AGENTS.md §2.3）
thiserror = "2.0"
anyhow = "1.0"

# 路径与 ID（AGENTS.md §2.5）
camino = { version = "1.1", features = ["serde1"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
ulid = { version = "1.1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
home = "0.5"

# 语义化版本（ExtensionManifest 版本字段用，见 design.md §23）
semver = { version = "1.0", features = ["serde"] }

# HTTP 客户端（直接依赖：providers；optional：tools[web]/core[ts]/server[otel 传递]；mcp 经 rmcp feature 传递。见 tech-stack.md §3；R3 ARCH-8 注释修正）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# URL 解析（轻量，无网络 IO；SSRF 校验用，见 policy/ssrf.rs）
url = "2.5"

# CLI（仅 cli 引入，见 tech-stack.md §4）
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
indicatif = "0.17"
anstream = "0.6"
anstyle = "1.0"
rustyline = "15.0"

# TUI（仅 tui 引入，见 tech-stack.md §4.2、modules.md §13.3）
# ratatui 0.30 默认内置 crossterm backend；MSRV 1.88（workspace 1.99 满足）。
# 输入区用 ratatui 原生事件处理 + 轻量 InputState，不引入 reedline（与全屏
# alternate screen 模式冲突，见 design.md §25 权衡记录）。
ratatui = "0.30"
crossterm = "0.29"

# seccomp 系统调用过滤（仅 minicoding-sandbox 引入，feature gate `seccomp`；
# 链接系统 libseccomp C 库，默认不开避免 CI/发行版需要头文件）
libseccomp = "0.4"

# 文件与代码处理（见 tech-stack.md §5）
globset = "0.4"
regex = "1.11"
ignore = "0.4"
similar = "2.6"
sha2 = "0.10"
htmd = "0.1"

# 备份打包（S-05，见 data-model.md §12）
tar = "0.4"
flate2 = "1"

# Token 计数（见 tech-stack.md §6）
tiktoken-rs = "0.6"

# 配置（见 tech-stack.md §8）
# 手写 TOML 解析（`toml` + `std::env`）：单一 config.toml 场景下 figment 收益不足，
# 不引入重依赖（2026-08-23 审查 §3 死依赖清理）。

# 文件监听（S-22 配置热更新，见 tech-stack.md §8、features.md S-22）
# 仅 core 引入；默认 features 含 macos_fsevent（macOS 原生后端），其余平台用 inotify/kqueue/ReadDirectoryChanges。
notify = "8"

# 测试（dev-dependencies，见 tech-stack.md §10）
wiremock = "0.6"
tempfile = "3.13"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

# 跨进程锁
fs2 = "0.4"

# HTTP server（仅 minicoding-server 引入，见 tech-stack.md §4、modules.md §16）
# `fs` feature 提供 `ServeDir`（M9 `--web` 静态资源托管，见 design.md §26.7）
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# LSP server（仅 minicoding-server 引入，feature gate `lsp`，见 modules.md §16.3）
tower-lsp = "0.20"

# TypeScript 类型生成（protocol + core + server 三处以 optional `ts` feature 引入，
# gen-types 脚本串起导出链；M9 前端 DTO 契约，见 AGENTS.md §8.4；R3 ARCH-8 修正）
# `serde-json-impl` 提供 `serde_json::Value` → `any` 的 TS 实现（DTO 含 JSON 字段）
ts-rs = { version = "10", features = ["no-serde-warnings", "serde-json-impl"] }

# 凭证存储（OS keychain，见 tech-stack.md §8）
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

# 内部 crate 互引（path 引用，确保本地开发一致性）
minicoding-core = { path = "crates/minicoding-core" }
minicoding-context = { path = "crates/minicoding-context" }
minicoding-policy = { path = "crates/minicoding-policy" }
minicoding-memory = { path = "crates/minicoding-memory" }
minicoding-hooks = { path = "crates/minicoding-hooks" }
minicoding-journal = { path = "crates/minicoding-journal" }
minicoding-sandbox = { path = "crates/minicoding-sandbox" }
minicoding-mcp = { path = "crates/minicoding-mcp" }
minicoding-storage = { path = "crates/minicoding-storage" }
minicoding-providers = { path = "crates/minicoding-providers" }
minicoding-tools = { path = "crates/minicoding-tools" }
minicoding-protocol = { path = "crates/minicoding-protocol" }
minicoding-server = { path = "crates/minicoding-server" }
minicoding-extension-sdk = { path = "crates/minicoding-extension-sdk" }
minicoding-cli = { path = "crates/minicoding-cli" }
minicoding-tui = { path = "crates/minicoding-tui" }
minicoding-sdk = { path = "crates/minicoding-sdk" }

# Workspace 默认 profile
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# pre-commit 配置（local hooks，不依赖外部 hook 仓库）
# 安装方式（任选其一）：
#   1. pipx install pre-commit && pre-commit install
#   2. 直接复制 scripts/git-hooks/pre-commit → .git/hooks/pre-commit
#
# 钩子内容：
#   - trailing whitespace / EOF newline / secrets 检查
#   - typos 拼写检查（_typos.toml）
#   - cargo fmt --check（格式校验）
#   - cargo clippy --workspace --all-targets -- -D warnings（零警告）
#   - cargo deny check（依赖治理：advisories/licenses/bans/sources）
#   - cargo audit（已知漏洞扫描，与 CI 一致）
#   - cargo llvm-cov --fail-under-lines 80（覆盖率门禁，pre-push 阶段）
#   - cargo test --workspace（单元测试，pre-push 阶段）
#
# 与 CI 门禁（AGENTS.md §6.3）一致，本地先拦截低级错误。

minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: 'Cargo.lock'
      - id: end-of-file-fixer
        exclude: '\.jsonl$'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: '(\.jsonl$|crates/minicoding-web/src/api/generated/)'

  - repo: local
    hooks:
      - id: typos
        name: typos (拼写检查)
        description: 拼写检查（_typos.toml 配置）
        entry: typos
        language: system
        types: [text]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-fmt
        name: cargo fmt --check
        description: 检查 Rust 代码格式（AGENTS.md §6.3 CI 门禁）
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy (deny warnings)
        description: clippy 零警告门禁（AGENTS.md §2.9 / §6.3）
        # 排除 minicoding-desktop：desktop feature 需 Tauri 系统库（webkit2gtk/glib）
        entry: cargo clippy --workspace --exclude minicoding-desktop --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-deny
        name: cargo deny check
        description: 依赖治理检查（AGENTS.md §2.7 / §5.2）
        entry: cargo deny check advisories licenses bans sources
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-audit
        name: cargo audit
        description: 已知漏洞扫描（AGENTS.md §5.2，与 CI audit job 一致）
        # `cargo audit` 默认：vulnerabilities 失败、unmaintained/yanked/notices 仅警告
        #（不用 `--deny vulnerabilities`——该参数无效，vulnerabilities 默认就 deny）
        entry: cargo audit
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test
        name: cargo test --workspace
        description: 单元测试门禁（AGENTS.md §2.8 / §6.3，覆盖率目标 ≥80%）
        # 排除 minicoding-desktop：desktop feature 需 Tauri 系统库
        entry: cargo test --workspace --exclude minicoding-desktop --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-coverage
        name: cargo llvm-cov (≥80%)
        description: 覆盖率门禁（AGENTS.md §2.8，与 CI coverage job 一致）
        # 排除前端层（tui/cli/server/desktop），库 crate 覆盖率目标 ≥80%
        entry: bash -c 'cargo llvm-cov --workspace --exclude minicoding-desktop --all-features --exclude minicoding-tui --exclude minicoding-cli --exclude minicoding-server --fail-under-lines 80'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: no-secrets-in-staged
        name: check no secrets staged
        description: 检查暂存区无敏感文件（AGENTS.md §6.4）
        entry: bash -c 'if git diff --cached --name-only | grep -Eq "\.env(\\..+)?$|credentials\\.json$|\\.pem$|\\.key$"; then echo "ERROR: 敏感文件被暂存（见 AGENTS.md §6.4）"; git diff --cached --name-only | grep -E "\.env(\\..+)?$|credentials\\.json$|\\.pem$|\\.key$"; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

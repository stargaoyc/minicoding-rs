# CI 门禁（T-M0-3 + T-M0-9，AGENTS.md §6.3）
#
# 8 道门禁：fmt / clippy -D warnings / test / coverage(≥80%) / cargo audit / cargo deny / typos / cross-platform
# 平台策略（features Q-07）：
#   - Linux：完整门禁（fmt/clippy/test/coverage/audit/deny/typos）+ Landlock 沙箱拒绝语义测试；
#   - macOS：编译 + 单测 matrix（Seatbelt 沙箱驱动，sandbox_init FFI）；
#   - Windows：编译 + 单测 matrix（Job Object 沙箱驱动，windows-sys FFI）。
# 三平台均有原生沙箱驱动（landlock/seatbelt/windows-sys），不再降级 NoopDriver。
#
# Rust 工具链：nightly（项目用 `let chains` 等 2024 edition 特性，MSRV 1.99，
#             见 `rust-toolchain.toml`）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features
        env:
          # 测试不连真实服务（AGENTS.md §5.4），mock 凭证即可
          OPENAI_API_KEY: sk-test-ci-mock-not-real

  coverage:
    name: cargo llvm-cov (≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov
        # 排除前端层（与 AGENTS.md §2.8 库 crate 覆盖率目标 ≥80% 对齐）：
        # - minicoding-tui：终端渲染，需 TTY 仿真
        # - minicoding-cli：入口 bin，集成测试覆盖
        # - minicoding-server：HTTP/SSE/ACP/LSP 前端层，集成测试覆盖（HTTP server
        #   需真实端口+客户端，单测覆盖率低，与 cli/tui 同性质）
        run: cargo llvm-cov --workspace --all-features --exclude minicoding-tui --exclude minicoding-cli --exclude minicoding-server --fail-under-lines 80
        env:
          OPENAI_API_KEY: sk-test-ci-mock-not-real

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # `cargo audit` 默认：vulnerabilities 失败、unmaintained/yanked/notices 仅警告。
        # 不使用 `--deny warnings`：number_prefix 0.4.0 是 indicatif 的传递依赖
        # （RUSTSEC-2025-0119 unmaintained），CI 不应因 unmaintained 警告阻断。
        # `--deny vulnerabilities` 是无效参数（vulnerabilities 默认就 deny）。
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check advisories licenses bans sources

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - name: typos
        run: typos

  # Q-07 跨平台编译+单测 matrix（macOS/Windows）。
  # macOS：Seatbelt 沙箱驱动（sandbox_init FFI），文件系统隔离。
  # Windows：Job Object 沙箱驱动（windows-sys FFI），进程遏制 + UI 隔离。
  # 三平台均有原生沙箱，不再降级 NoopDriver。
  cross-platform:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features
        env:
          OPENAI_API_KEY: sk-test-ci-mock-not-real

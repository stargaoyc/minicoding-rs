# CI 门禁（T-M0-3 + T-M0-9，AGENTS.md §6.3）
#
# 10 道门禁（DOC-10，2026-08-25 R2 审查对齐）：fmt / clippy -D warnings / test / coverage(≥80%) / cargo audit / cargo deny / typos / cross-platform / web / desktop
# 平台策略（features Q-07）：
#   - Linux：完整门禁（fmt/clippy/test/coverage/audit/deny/typos）+ Landlock 沙箱拒绝语义测试；
#   - macOS：编译 + 单测 matrix（Seatbelt 沙箱驱动，sandbox_init FFI）；
#   - Windows：编译 + 单测 matrix（Job Object 沙箱驱动，windows-sys FFI）。
# 三平台均有原生沙箱驱动（landlock/seatbelt/windows-sys），不再降级 NoopDriver。
#
# desktop feature 策略（W-06/W-07）：
#   - `minicoding-desktop` 的 `desktop` feature 依赖 Tauri（需 webkit2gtk/glib 系统库），
#     不在常规 `--all-features` 中编译，单独在 `desktop` job 中安装依赖后编译。
#
# Rust 工具链：nightly（项目用 `let chains` 等 2024 edition 特性，MSRV 1.99，
#             见 `rust-toolchain.toml`）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# ENG-1（2026-08-25 R2 审查）：同分支重复 push 取消旧 run，release tag 串行化
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        # 排除 minicoding-desktop：desktop feature 需 Tauri 系统库（webkit2gtk/glib），
        # 在 desktop job 中单独编译
        run: cargo clippy --workspace --exclude minicoding-desktop --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # 排除 minicoding-desktop：desktop feature 需 Tauri 系统库
        run: cargo test --workspace --exclude minicoding-desktop --all-features
        env:
          # 测试不连真实服务（AGENTS.md §5.4），mock 凭证即可
          OPENAI_API_KEY: sk-test-ci-mock-not-real

  coverage:
    name: cargo llvm-cov (≥80%)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Q7：排除层（cli/server/tui）覆盖率可见性——逐 crate summary-only，
      # 不计门禁仅供趋势观察；desktop 需 GUI 系统库，不在 CI 覆盖
      - name: coverage visibility (excluded crates)
        run: |
          for p in minicoding-cli minicoding-server minicoding-tui; do
            echo "=== $p ==="
            cargo llvm-cov -p $p --summary-only || true
          done
      - name: cargo llvm-cov
        # 排除前端层（与 AGENTS.md §2.8 库 crate 覆盖率目标 ≥80% 对齐）：
        # - minicoding-tui：终端渲染，需 TTY 仿真
        # - minicoding-cli：入口 bin，集成测试覆盖
        # - minicoding-server：HTTP/SSE/ACP/LSP 前端层，集成测试覆盖（HTTP server
        #   需真实端口+客户端，单测覆盖率低，与 cli/tui 同性质）
        # - minicoding-desktop：Tauri 桌面壳，需 GUI 运行时，集成测试覆盖
        run: cargo llvm-cov --workspace --exclude minicoding-desktop --all-features --exclude minicoding-tui --exclude minicoding-cli --exclude minicoding-server --fail-under-lines 80
        env:
          OPENAI_API_KEY: sk-test-ci-mock-not-real

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # `cargo audit` 默认：vulnerabilities 失败、unmaintained/yanked/notices 仅警告。
        # 不使用 `--deny warnings`：number_prefix 0.4.0 是 indicatif 的传递依赖
        # （RUSTSEC-2025-0119 unmaintained），CI 不应因 unmaintained 警告阻断。
        # `--deny vulnerabilities` 是无效参数（vulnerabilities 默认就 deny）。
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check advisories licenses bans sources

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - name: typos
        run: typos

  # Q-07 跨平台编译+单测 matrix（macOS/Windows）。
  # macOS：Seatbelt 沙箱驱动（sandbox_init FFI），文件系统隔离。
  # Windows：Job Object 沙箱驱动（windows-sys FFI），进程遏制 + UI 隔离。
  # 三平台均有原生沙箱，不再降级 NoopDriver。
  # 排除 minicoding-desktop：desktop feature 需平台 GUI 库，单独在 desktop job 编译。
  cross-platform:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --exclude minicoding-desktop --all-features
        env:
          OPENAI_API_KEY: sk-test-ci-mock-not-real

  # D1（2026-08-25）：Windows 目标交叉编译检查。本轮两次发布 CI 失败根因相同——
  # windows-sys FFI 分支只在真实 Windows runner 的 cross-platform job 中才被编译，
  # Linux 本地任何门禁均不可达，问题直到推送后才暴露。SEC-4 教训：
  # QueryInformationJobObject FFI 声明错误本可在 ubuntu 上用 `--target` check
  # 提前拦截。纯 check 无需 MSVC linker；ring/aws-lc 不在下列 crate 的
  # windows 依赖闭包中。并发取消沿用 workflow 级 concurrency 组，无需 job 级配置。
  # 不含 minicoding-desktop：其 windows 依赖闭包重且 sidecar 占位二进制按目标
  # 平台命名，desktop 由 cross-platform(windows-latest) 原生覆盖。
  windows-target-check:
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - name: Add Windows MSVC target
        run: rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --target x86_64-pc-windows-msvc
        run: cargo check --target x86_64-pc-windows-msvc -p minicoding-core -p minicoding-sandbox -p minicoding-tools -p minicoding-journal -p minicoding-policy -p minicoding-storage

  # M-14/R-10：前端单测基建（Vitest + MSW，AGENTS.md §8.8）。
  # oxlint/oxfmt/tsc/vitest/vite build 与 Rust 侧 fmt/clippy/test 门禁对齐；
  # 测试不连真实后端（MSW 拦截 REST + mock EventSource 重放 SSE fixture）。
  web:
    name: web (oxlint + tsc + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          # 与 desktop-release.yml 一致：钉精确版（pnpm-lock.yaml 由 11.13.0 生成，
          # 浮动大版本可能因 lockfile/行为差异导致 --frozen-lockfile 失败）
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          # 与 desktop-release.yml 一致：node 22 主线（≥22.13 内置 node:sqlite，pnpm 11 依赖）
          node-version: '22'
          cache: pnpm
          cache-dependency-path: crates/minicoding-web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: crates/minicoding-web
        run: pnpm install --frozen-lockfile
      # AGENTS.md §8.4：生成 DTO 与 Rust 源一致性门禁（2026-08-23 审查 §11-P1）
      - name: Verify generated DTO types are up to date
        working-directory: crates/minicoding-web
        run: |
          pnpm gen-types
          git diff --exit-code src/api/generated ||             (echo "::error::generated DTO 与 Rust 源不一致：请运行 pnpm gen-types 并提交" && exit 1)
      - name: Lint
        working-directory: crates/minicoding-web
        run: pnpm lint
      - name: Typecheck
        working-directory: crates/minicoding-web
        run: pnpm typecheck
      - name: Unit tests
        working-directory: crates/minicoding-web
        run: pnpm test
      - name: Build
        working-directory: crates/minicoding-web
        run: pnpm build

  # W-06/W-07：Tauri 桌面壳编译（需 webkit2gtk/glib 系统库）。
  # 仅编译不运行（需 GUI 运行时），验证 desktop feature 代码正确性。
  desktop:
    name: cargo build desktop feature
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ENG-2：防 job 挂起烧满 runner 上限
    steps:
      - uses: actions/checkout@v6
      # 钉住已验证的 nightly：2026-08-22 后的 nightly（c656540d）在 tokio opaque
      # type 上触发 rustc ICE（layout_of rigid alias），全 workspace clippy/test 均命中。
      # 上游修复后可解除钉住恢复 @nightly。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev
      - name: Create placeholder frontend dist
        run: |
          mkdir -p crates/minicoding-web/dist
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>minicoding</title></head><body><div id="root"></div></body></html>' > crates/minicoding-web/dist/index.html
      - name: Create placeholder sidecar binary
        # tauri.conf.json 的 externalBin 在 bundle 时校验二进制存在，
        # CI 仅编译不 bundle，但 generate_context! 可能读取配置，预留占位文件。
        # 文件名必须与 tauri.conf.json 的 externalBin 一致（minicoding-server-sidecar）。
        run: |
          mkdir -p crates/minicoding-desktop/binaries
          echo '#!/bin/sh' > crates/minicoding-desktop/binaries/minicoding-server-sidecar-x86_64-unknown-linux-gnu
          chmod +x crates/minicoding-desktop/binaries/minicoding-server-sidecar-x86_64-unknown-linux-gnu
      - name: cargo build desktop
        run: cargo build -p minicoding-desktop --features desktop
      - name: cargo clippy desktop
        run: cargo clippy -p minicoding-desktop --features desktop -- -D warnings

# 桌面应用发布工作流（M9，独立于 cargo-dist 的 release.yml）。
#
# 触发条件：与 release.yml 相同的版本 tag（如 v0.1.0），但仅构建桌面安装包。
# 产物：.dmg（macOS）/ .msi（Windows）/ .AppImage + .deb（Linux），上传到同一 GitHub Release。
#
# 为什么独立工作流：
#   - cargo-dist 的 release.yml 仅构建 CLI 二进制（`dist = false` 排除 desktop crate）；
#   - Tauri 需要 `tauri build` 产出 GUI 安装包，流程与 cargo-dist 不兼容；
#   - 桌面构建需要前端（pnpm）+ server 二进制（cargo）+ Tauri 系统库，独立 matrix 更清晰。
#
# 详见 `docs/design.md` §26 + `scripts/build-desktop.sh`。

name: Desktop Release

permissions:
  contents: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

jobs:
  build-desktop:
    name: build-desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon + Intel（macos-14 为 Apple Silicon runner，
          # x86_64 通过交叉编译产出 Intel 二进制，Rust 原生支持）
          - os: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - os: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
          # Windows
          - os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          # Linux
          - os: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install stable Rust for cargo-tauri
        uses: dtolnay/rust-toolchain@stable

      # 交叉编译目标（如 macos-x86_64 在 arm runner 上）的 std 必须在"实际执行
      # cargo 的工具链"上存在：后续步骤的裸 cargo 解析到 nightly 还是 stable 取决
      # 于 dtolnay action 的安装顺序（上游行为曾变化，v0.3.0 曾因此 E0463 失败），
      # 因此对 stable 也显式补齐 ${{ matrix.target }}（host 目标时为幂等空操作）；
      # nightly 已由上方 targets 参数覆盖。
      - name: Ensure target std on stable toolchain
        run: rustup target add --toolchain stable ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup pnpm
        # 锁定 pnpm 版本：pnpm-lock.yaml 由 pnpm 11.13.0 生成（lockfileVersion 9.0），
        # runner 预装 pnpm 版本不固定，版本不匹配会导致 install --frozen-lockfile 失败。
        # 不在此处开启 cache（corepack 安装模式下 store path 探测与 setup-node 冲突）。
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Setup Node.js
        # node ≥ 22.13：pnpm 11 依赖内置模块 node:sqlite（v20 上启动即崩
        # ERR_UNKNOWN_BUILTIN_MODULE，v0.2.17 失败根因）。
        # 不配置 cache: 'pnpm'——setup-node 的 pnpm store path 探测与
        # pnpm/action-setup 安装组合在 runner 上报错。
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install cargo-tauri
        run: rustup run stable cargo install tauri-cli --version "^2" --locked

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev

      - name: Build Web frontend
        working-directory: crates/minicoding-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build minicoding-server binary
        run: cargo build --release -p minicoding-server --target ${{ matrix.target }}

      - name: Place sidecar binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p crates/minicoding-desktop/binaries
          cp target/${{ matrix.target }}/release/minicoding-server \
             crates/minicoding-desktop/binaries/minicoding-server-sidecar-${{ matrix.target }}
          chmod +x crates/minicoding-desktop/binaries/minicoding-server-sidecar-${{ matrix.target }}

      - name: Place sidecar binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/minicoding-desktop/binaries
          Copy-Item "target/${{ matrix.target }}/release/minicoding-server.exe" `
                    "crates/minicoding-desktop/binaries/minicoding-server-sidecar-${{ matrix.target }}.exe"

      - name: Tauri build
        working-directory: crates/minicoding-desktop
        run: cargo tauri build --target ${{ matrix.target }} --features desktop

      - name: List bundle output
        # 调试：显示 Tauri 产出的 bundle 文件（cargo tauri build 使用 workspace target/）
        shell: bash
        run: |
          echo "=== bundle 目录内容 ==="
          find "target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null | sort || echo "(bundle 目录不存在)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error

  upload-to-release:
    name: upload-to-release
    needs: build-desktop
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Uploading desktop artifacts to release: $TAG"
          # 只收集文件（排除目录），用 find -type f 确保不误传目录给 gh
          mapfile -t files < <(find artifacts -type f | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ 没有找到任何 artifacts 文件"
            exit 1
          fi
          echo "找到 ${#files[@]} 个文件："
          printf '  %s\n' "${files[@]}"
          # release 已由 cargo-dist 的 release.yml 创建，直接上传 assets
          gh release upload "$TAG" "${files[@]}" --clobber

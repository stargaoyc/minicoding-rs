# 桌面应用发布工作流（M9，独立于 cargo-dist 的 release.yml）。
#
# 触发条件：与 release.yml 相同的版本 tag（如 v0.1.0），但仅构建桌面安装包。
# 产物：.dmg（macOS）/ .msi（Windows）/ .AppImage + .deb（Linux），上传到同一 GitHub Release。
#
# 为什么独立工作流：
#   - cargo-dist 的 release.yml 仅构建 CLI 二进制（`dist = false` 排除 desktop crate）；
#   - Tauri 需要 `tauri build` 产出 GUI 安装包，流程与 cargo-dist 不兼容；
#   - 桌面构建需要前端（pnpm）+ server 二进制（cargo）+ Tauri 系统库，独立 matrix 更清晰。
#
# 详见 `docs/design.md` §26 + `scripts/build-desktop.sh`。

name: Desktop Release

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # ENG-7（2026-08-25 R2 审查）：写权限仅 upload job 需要

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-desktop:
    name: build-desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90 # Tauri 三平台构建较慢
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon + Intel（macos-14 为 Apple Silicon runner，
          # x86_64 通过交叉编译产出 Intel 二进制，Rust 原生支持）
          - os: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - os: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
          # Windows
          - os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          # Linux
          - os: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 工具链与 ci.yml 对齐：滚动 nightly（2026-08-30 解除钉版，ICE 已由
      # 2026-08-27 nightly 修复；曾钉住 nightly-2026-08-18）。项目 MSRV 1.99
      # 而当前 stable 频道为 1.98（runner 镜像亦然），stable 无法编译项目代码；
      # v0.2.33 能过纯属裸 cargo 恰好解析到 nightly（dtolnay action 上游行为
      # 变更后失效，v0.3.0 连续发布失败的根因）。分工如下：
      #   - 项目代码（server sidecar / desktop app）：nightly（滚动），
      #     所有编译步骤显式 `rustup run`，不依赖隐式解析；
      #   - tauri-cli 外部工具：runner 预装 stable 即可（不涉及项目 MSRV）。
      # 交叉目标 std 由 targets 参数直接装入 nightly 工具链。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot（ENG-11：@master 浮动引用改为 SHA 钉版）
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup pnpm
        # 锁定 pnpm 版本：pnpm-lock.yaml 由 pnpm 11.13.0 生成（lockfileVersion 9.0），
        # runner 预装 pnpm 版本不固定，版本不匹配会导致 install --frozen-lockfile 失败。
        # 不在此处开启 cache（corepack 安装模式下 store path 探测与 setup-node 冲突）。
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Setup Node.js
        # node ≥ 22.13：pnpm 11 依赖内置模块 node:sqlite（v20 上启动即崩
        # ERR_UNKNOWN_BUILTIN_MODULE，v0.2.17 失败根因）。
        # 不配置 cache: 'pnpm'——setup-node 的 pnpm store path 探测与
        # pnpm/action-setup 安装组合在 runner 上报错。
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install cargo-tauri
        run: rustup run stable cargo install tauri-cli --version "^2" --locked # 钉主版本防破坏性变更（ENG-7：精确 patch 钉版待上游发布节奏稳定后收紧）

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev

      - name: Build Web frontend
        working-directory: crates/minicoding-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build minicoding-server binary
        run: rustup run nightly cargo build --release -p minicoding-server --target ${{ matrix.target }}

      - name: Place sidecar binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p crates/minicoding-desktop/binaries
          cp target/${{ matrix.target }}/release/minicoding-server \
             crates/minicoding-desktop/binaries/minicoding-server-sidecar-${{ matrix.target }}
          chmod +x crates/minicoding-desktop/binaries/minicoding-server-sidecar-${{ matrix.target }}

      - name: Place sidecar binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/minicoding-desktop/binaries
          Copy-Item "target/${{ matrix.target }}/release/minicoding-server.exe" `
                    "crates/minicoding-desktop/binaries/minicoding-server-sidecar-${{ matrix.target }}.exe"

      - name: Tauri build
        working-directory: crates/minicoding-desktop
        run: rustup run nightly cargo tauri build --target ${{ matrix.target }} --features desktop

      - name: List bundle output
        # 调试：显示 Tauri 产出的 bundle 文件（cargo tauri build 使用 workspace target/）
        shell: bash
        run: |
          echo "=== bundle 目录内容 ==="
          find "target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null | sort || echo "(bundle 目录不存在)"

      # ENG-1（2026-08-26 R3 审查）：生成 SHA256SUMS——桌面产物此前无任何
      # 完整性校验手段。R3 发布教训：macOS bash 3.2 下转义括号 find 偶发零匹配
      # 产出空文件，gh 上传空文件报 HTTP 400 Bad Content-Length 致整个 upload
      # job 失败——改为显式多轮 glob 追加 + 空文件守卫（无产物时显式失败而非
      # 静默上传空 SUMS）。
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release/bundle"
          out="../../../../SHA256SUMS-desktop-${{ matrix.os }}.txt"
          : > "$out"
          # 跨平台：Linux 有 sha256sum；macOS 只有 shasum -a 256（R3 发布
          # 教训：macOS 上 sha256sum 不存在——首跑 || true 吞错产出空 SUMS
          # 致 gh 上传 HTTP 400，二跑严格守卫显式暴露）
          if command -v sha256sum >/dev/null 2>&1; then
            sum() { sha256sum "$@"; }
          elif command -v shasum >/dev/null 2>&1; then
            sum() { shasum -a 256 "$@"; }
          else
            echo "::error::无 sha256sum/shasum 可用"
            exit 1
          fi
          for pat in *.dmg *.msi *.exe *.AppImage *.deb \
                     */*.dmg */*.msi */*.exe \
                     */*.AppImage */*.deb; do
            [ -f "$pat" ] || continue
            sum "$pat" >> "$out"
          done
          if [ ! -s "$out" ]; then
            echo "::error::未找到任何桌面安装包，SHA256SUMS 为空"
            exit 1
          fi
          cat "$out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            SHA256SUMS-desktop-${{ matrix.os }}.txt
          if-no-files-found: error

  upload-to-release:
    name: upload-to-release
    needs: build-desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 90 # Tauri 三平台构建较慢
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Uploading desktop artifacts to release: $TAG"
          # 只收集文件（排除目录），用 find -type f 确保不误传目录给 gh
          mapfile -t files < <(find artifacts -type f | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ 没有找到任何 artifacts 文件"
            exit 1
          fi
          echo "找到 ${#files[@]} 个文件："
          printf '  %s\n' "${files[@]}"
          # Release 正常由 cargo-dist 的 release.yml 创建；若其未运行或失败（发布竞态），
          # 这里兜底创建，避免 gh release upload 因 Release 不存在而整体失败（E-1）。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Release $TAG 不存在，兜底创建"
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Desktop installers for $TAG (fallback: created by Desktop Release workflow because release.yml did not create it)."
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
